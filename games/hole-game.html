<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Hole Game | Dipanshu Sharma Games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:'DM Sans',sans-serif;}
canvas{display:block;}
.screen{display:none;position:fixed;inset:0;z-index:10;flex-direction:column;align-items:center;justify-content:center;}
.screen.active{display:flex;}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 30%,#1a0533,#0a0a1a 70%);}
.bg-dots{position:fixed;inset:0;z-index:0;}
/* CARD */
.card{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border-radius:20px;
  border:1px solid rgba(255,255,255,.1);padding:2rem;max-width:440px;
  width:calc(100% - 2rem);box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center;}
.title{font-family:'Fredoka One',cursive;font-size:clamp(2rem,7vw,2.8rem);
  color:#e040fb;text-shadow:0 0 30px rgba(224,64,251,.5);margin-bottom:.3rem;}
.sub{font-size:.88rem;color:rgba(255,255,255,.55);margin-bottom:1.5rem;line-height:1.6;}
.inp{width:100%;padding:.75rem 1rem;border:1.5px solid rgba(255,255,255,.15);border-radius:12px;
  font-family:'DM Sans',sans-serif;font-size:.95rem;color:#fff;
  background:rgba(255,255,255,.08);outline:none;margin-bottom:.75rem;}
.inp::placeholder{color:rgba(255,255,255,.3);}
.inp:focus{border-color:#e040fb;}
.inp-label{display:block;font-size:.7rem;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:.3rem;text-align:left;}
select.inp option{background:#0a0a1a;}
.set-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:.9rem;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  padding:.75rem 1.75rem;border:none;border-radius:100px;font-family:'Fredoka One',cursive;
  font-size:1rem;cursor:pointer;transition:all .2s;width:100%;}
.btn-purple{background:linear-gradient(135deg,#9c27b0,#6a1b9a);color:#fff;
  box-shadow:0 4px 14px rgba(156,39,176,.4);margin-bottom:.5rem;}
.btn-purple:hover{transform:translateY(-2px);}
.btn-grey{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);
  border:1.5px solid rgba(255,255,255,.15);}
.btn-grey:hover{background:rgba(255,255,255,.18);}
.tab-row{display:flex;gap:.5rem;margin-bottom:1rem;}
.tab-btn{flex:1;padding:.6rem;border:1.5px solid rgba(255,255,255,.15);border-radius:12px;
  background:transparent;font-family:'Fredoka One',cursive;font-size:.95rem;
  color:rgba(255,255,255,.5);cursor:pointer;transition:all .18s;}
.tab-btn.active{background:#9c27b0;border-color:#9c27b0;color:#fff;}
/* LOBBY */
.room-code{display:block;font-family:'Fredoka One',cursive;font-size:2.6rem;color:#e040fb;
  letter-spacing:.2em;background:rgba(224,64,251,.06);border:2px dashed rgba(224,64,251,.3);
  border-radius:14px;padding:.4rem 1rem;margin:.6rem 0 .4rem;}
.room-hint{font-size:.77rem;color:rgba(255,255,255,.35);margin-bottom:1rem;}
.pl-list{background:rgba(0,0,0,.3);border-radius:14px;padding:.9rem;margin-bottom:.9rem;min-height:70px;}
.pl-title{font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.35);margin-bottom:.5rem;}
.pl-row{display:flex;align-items:center;gap:.7rem;padding:.35rem 0;border-bottom:1px solid rgba(255,255,255,.05);}
.pl-row:last-child{border-bottom:none;}
.pl-dot{width:12px;height:12px;border-radius:50%;}
.pl-name{flex:1;font-size:.88rem;color:#fff;font-weight:600;}
.pl-badge{font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:100px;padding:.1rem .5rem;}
.badge-host{background:rgba(224,64,251,.15);color:#e040fb;}
.badge-you{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);}
.lobby-count{font-size:.8rem;color:rgba(255,255,255,.35);margin-bottom:.7rem;}
/* GAME */
#screenGame{display:none;position:fixed;inset:0;z-index:5;flex-direction:column;}
#screenGame.active{display:flex;}
#gameCanvas{flex:1;display:block;width:100%;touch-action:none;}
/* HUD */
.hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;
  gap:.5rem;padding:.4rem .8rem;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.06);pointer-events:none;}
.hud-title{font-family:'Fredoka One',cursive;font-size:.95rem;color:#e040fb;margin-right:.3rem;}
.hud-pill{background:rgba(255,255,255,.08);border-radius:100px;padding:.2rem .65rem;
  font-size:.75rem;color:rgba(255,255,255,.8);font-weight:600;white-space:nowrap;}
.hud-pill.you{background:rgba(224,64,251,.15);color:#e040fb;}
.hud-spacer{flex:1;}
.hud-btn{pointer-events:all;background:rgba(255,255,255,.1);border:none;border-radius:100px;
  padding:.25rem .75rem;font-family:'Fredoka One',cursive;font-size:.8rem;
  color:rgba(255,255,255,.7);cursor:pointer;}
.hud-btn:hover{background:rgba(255,255,255,.2);}
/* Joystick */
#joystickWrap{position:fixed;bottom:24px;left:24px;z-index:25;
  width:120px;height:120px;touch-action:none;display:none;}
#joystickBase{width:120px;height:120px;border-radius:50%;
  background:rgba(156,39,176,.15);border:2px solid rgba(224,64,251,.3);}
#joystickThumb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:48px;height:48px;border-radius:50%;
  background:rgba(156,39,176,.7);border:2px solid #e040fb;
  box-shadow:0 0 16px rgba(224,64,251,.5);}
/* Score */
#scoreOverlay{position:fixed;top:52px;right:8px;z-index:20;
  background:rgba(0,0,0,.65);backdrop-filter:blur(10px);
  border-radius:12px;padding:.55rem .7rem;min-width:145px;
  border:1px solid rgba(255,255,255,.07);pointer-events:none;}
.sc-title{font-family:'Fredoka One',cursive;font-size:.75rem;color:#e040fb;
  margin-bottom:.35rem;text-align:center;}
.sc-row{display:flex;align-items:center;gap:.35rem;padding:.15rem 0;
  font-size:.72rem;border-bottom:1px solid rgba(255,255,255,.04);}
.sc-row:last-child{border-bottom:none;}
.sc-dot{width:9px;height:9px;border-radius:50%;}
.sc-name{flex:1;color:rgba(255,255,255,.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sc-score{font-family:'Fredoka One',cursive;color:#e040fb;font-size:.78rem;}
/* Flash */
#flashMsg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
  z-index:100;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);
  border-radius:16px;padding:1.2rem 2rem;text-align:center;
  border:1px solid rgba(224,64,251,.2);transition:transform .25s;pointer-events:none;}
#flashMsg.show{transform:translate(-50%,-50%) scale(1);}
.flash-icon{font-size:2.5rem;}
.flash-text{font-family:'Fredoka One',cursive;font-size:1.5rem;color:#fff;margin-top:.25rem;}
.flash-sub{font-size:.82rem;color:rgba(255,255,255,.55);margin-top:.15rem;}
/* Toast */
.toast{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%) translateY(60px);
  background:rgba(156,39,176,.9);color:#fff;padding:.6rem 1.4rem;border-radius:100px;
  font-size:.86rem;font-weight:600;z-index:9000;transition:transform .3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
/* Podium */
.podium-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.8);
  backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;}
.podium-overlay.show{display:flex;}
.podium-box{background:rgba(10,5,25,.97);border-radius:24px;padding:2rem 1.75rem 1.5rem;
  max-width:480px;width:calc(100% - 2rem);text-align:center;
  border:1px solid rgba(224,64,251,.2);box-shadow:0 20px 60px rgba(0,0,0,.8);}
.podium-title{font-family:'Fredoka One',cursive;font-size:1.8rem;color:#e040fb;margin-bottom:1rem;}
.podium-stage{display:flex;align-items:flex-end;justify-content:center;gap:.4rem;margin-bottom:1rem;}
.p-step{display:flex;flex-direction:column;align-items:center;border-radius:10px 10px 0 0;position:relative;}
.p-step-1{background:linear-gradient(180deg,#fdd835,#f9a825);width:110px;height:90px;order:2;}
.p-step-2{background:linear-gradient(180deg,#b0bec5,#78909c);width:90px;height:65px;order:1;}
.p-step-3{background:linear-gradient(180deg,#a1887f,#795548);width:80px;height:48px;order:3;}
.p-step-inner{display:flex;flex-direction:column;align-items:center;padding:.3rem .4rem .4rem;height:100%;justify-content:flex-end;}
.p-step-icon{font-size:1.6rem;margin-top:-22px;}
.p-step-medal{font-size:1.2rem;position:absolute;top:-20px;}
.p-step-name{font-family:'Fredoka One',cursive;font-size:.78rem;color:#fff;max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:.2rem;}
.p-step-pts{font-size:.68rem;color:rgba(255,255,255,.75);}
.podium-btns{display:flex;gap:.6rem;justify-content:center;margin-top:1rem;flex-wrap:wrap;}
.conf-layer{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;}
.conf-p{position:absolute;top:-20px;animation:confFall linear forwards;}
@keyframes confFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@media(max-width:600px){.set-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="bg-dots" id="bgDots"></div>
<div class="conf-layer" id="confLayer"></div>
<div class="toast" id="toast"></div>
<div id="flashMsg">
  <div class="flash-icon" id="flashIcon"></div>
  <div class="flash-text" id="flashText"></div>
  <div class="flash-sub" id="flashSub"></div>
</div>
<div class="podium-overlay" id="podiumOverlay">
  <div class="podium-box">
    <div class="podium-title">🕳️ Final Rankings</div>
    <div class="podium-stage" id="podiumStage"></div>
    <div style="font-size:.8rem;color:rgba(255,255,255,.4);margin:.75rem 0;" id="podiumSub"></div>
    <div class="podium-btns">
      <button class="btn btn-purple" style="width:auto;padding:.65rem 1.5rem;" onclick="playAgain()">🔄 Play Again</button>
      <button class="btn btn-grey" style="width:auto;padding:.65rem 1.5rem;" onclick="goHome()">🏠 Home</button>
    </div>
  </div>
</div>

<!-- LANDING -->
<div class="screen active" id="screenLanding">
  <div class="card">
    <div style="font-size:3rem;margin-bottom:.6rem;animation:holeSpin 3s linear infinite;display:inline-block;">🕳️</div>
    <h1 class="title">Hole Game</h1>
    <p class="sub">Eat city objects to grow your hole. Bigger holes eat bigger things. Eat other players to win!</p>
    <div style="margin-bottom:.75rem;">
      <label class="inp-label">Your Name</label>
      <input class="inp" id="playerName" type="text" placeholder="Enter your name…" maxlength="18" autocomplete="off"/>
    </div>
    <div class="tab-row">
      <button class="tab-btn active" id="tabCreate" onclick="showTab('create')">🏠 Create</button>
      <button class="tab-btn" id="tabJoin" onclick="showTab('join')">🚪 Join</button>
    </div>
    <div id="panelCreate">
      <div class="set-row">
        <div>
          <label class="inp-label">Game duration</label>
          <select class="inp" id="settingDur" style="margin-bottom:0;">
            <option value="120">2 min</option>
            <option value="180" selected>3 min</option>
            <option value="300">5 min</option>
          </select>
        </div>
        <div>
          <label class="inp-label">Max players</label>
          <select class="inp" id="settingMax" style="margin-bottom:0;">
            <option value="4">4 players</option>
            <option value="6" selected>6 players</option>
          </select>
        </div>
      </div>
      <button class="btn btn-purple" onclick="createRoom()">🕳️ Create Room</button>
    </div>
    <div id="panelJoin" style="display:none;">
      <label class="inp-label">Room Code</label>
      <input class="inp" id="joinCode" type="text" placeholder="ABCD" maxlength="4"
        style="text-transform:uppercase;font-family:'Fredoka One',cursive;
               font-size:1.4rem;letter-spacing:.25em;text-align:center;"/>
      <button class="btn btn-purple" onclick="joinRoom()">🚪 Join Room</button>
    </div>
  </div>
</div>

<!-- LOBBY -->
<div class="screen" id="screenLobby">
  <div class="card">
    <div style="font-family:'Fredoka One',cursive;font-size:1.5rem;color:#e040fb;margin-bottom:.5rem;">🕳️ Hole Game — Lobby</div>
    <div class="room-code" id="lobbyCode">????</div>
    <div class="room-hint">Share this code with friends</div>
    <div class="pl-list">
      <div class="pl-title">Players joined</div>
      <div id="lobbyPlayers"></div>
    </div>
    <div class="lobby-count" id="lobbyCount">1 / 6 players</div>
    <div style="background:rgba(224,64,251,.04);border-radius:10px;padding:.6rem;margin-bottom:.9rem;font-size:.8rem;color:rgba(255,255,255,.5);" id="lobbyMeta"></div>
    <button class="btn btn-purple" id="btnStart" onclick="startGame()" style="display:none;">▶ Start Game!</button>
    <div style="font-size:.82rem;color:rgba(255,255,255,.35);font-style:italic;margin-bottom:.5rem;" id="waitMsg">Waiting for host…</div>
    <button class="btn btn-grey" onclick="leaveRoom()">← Leave</button>
  </div>
</div>

<!-- GAME -->
<div id="screenGame">
  <div class="hud">
    <span class="hud-title">🕳️</span>
    <span class="hud-pill you" id="hudSize">Size: 1</span>
    <span class="hud-pill" id="hudScore">Score: 0</span>
    <span class="hud-pill" id="hudTimer">3:00</span>
    <span class="hud-spacer"></span>
    <button class="hud-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
    <button class="hud-btn" onclick="goHome()">✕</button>
  </div>
  <div id="scoreOverlay">
    <div class="sc-title">Rankings</div>
    <div id="scoreList"></div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="joystickWrap">
    <div id="joystickBase"><div id="joystickThumb"></div></div>
  </div>
</div>

<style>
@keyframes holeSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, get, update, onValue, remove, off }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const FB = initializeApp({
  apiKey:"AIzaSyB07k6RVERpBEvk9uV9Epaj0jfAmsbMDns",
  authDomain:"dipanshulabs-games.firebaseapp.com",
  databaseURL:"https://dipanshulabs-games-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"dipanshulabs-games",
  storageBucket:"dipanshulabs-games.firebasestorage.app",
  messagingSenderId:"1053553176032",
  appId:"1:1053553176032:web:ce2b7f5d72c6bc73f5cf85"
});
const db = getDatabase(FB);

/* ══ CONSTANTS ══ */
const WORLD   = 4000;
const SPEED   = 180;
const SYNC_MS = 100;
const COLORS  = ['#e040fb','#00e5ff','#76ff03','#ff9100','#ff1744','#00e676'];

/* ══ CITY OBJECTS ══ */
const OBJ_TYPES=[
  {emoji:'🌳',pts:1,size:0.8,w:30,h:30},
  {emoji:'🚗',pts:2,size:1.2,w:40,h:25},
  {emoji:'🚕',pts:2,size:1.2,w:40,h:25},
  {emoji:'🚙',pts:3,size:1.5,w:45,h:28},
  {emoji:'🚌',pts:4,size:2,w:60,h:30},
  {emoji:'🏠',pts:5,size:2.5,w:55,h:55},
  {emoji:'🏢',pts:8,size:4,w:70,h:80},
  {emoji:'🏬',pts:10,size:5,w:80,h:90},
  {emoji:'🏗️',pts:15,size:7,w:90,h:110},
  {emoji:'🏭',pts:20,size:9,w:100,h:100},
  {emoji:'🏦',pts:25,size:11,w:110,h:120},
  {emoji:'🏰',pts:40,size:15,w:130,h:140},
  {emoji:'🗼',pts:60,size:20,w:60,h:160},
  {emoji:'🏛️',pts:80,size:25,w:140,h:140},
  {emoji:'🗽',pts:100,size:30,w:80,h:180},
];

/* ══ STATE ══ */
let myPid=null,myName='',roomId=null,isHost=false;
let gameState={},listeners=[],soundOn=true;
let gameRunning=false,gameOver=false;
let cityObjects=[]; // {id,x,y,type,eaten,eatenBy}
let canvas,ctx,W,H;
let timerInterval=null,syncTimer=null;

/* My player */
let me={x:WORLD/2,y:WORLD/2,vx:0,vy:0,size:1,score:0,eaten:0,alive:true,colorIdx:0};
let others={}; // pid->{x,y,size,score,alive,colorIdx,name}

/* Camera with smooth follow */
let cam={x:WORLD/2,y:WORLD/2};

/* ══ AUDIO ══ */
let actx=null;
function getACtx(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}
function beep(f,t,d,v=0.15){if(!soundOn)return;try{const c=getACtx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=t||'sine';o.frequency.value=f;const ts=c.currentTime;g.gain.setValueAtTime(v,ts);g.gain.exponentialRampToValueAtTime(0.001,ts+d);o.start(ts);o.stop(ts+d);}catch(e){}}
const SFX={
  eat(pts){const f=200+pts*15;beep(f,'sawtooth',.1,.2);setTimeout(()=>beep(f*1.5,'sine',.08,.15),80);},
  eatPlayer(){beep(880,'triangle',.2,.25);setTimeout(()=>beep(1200,'triangle',.15,.2),120);},
  die(){[330,280,220].forEach((f,i)=>beep(f,'sawtooth',.2,.2,i*.08));},
  win(){[523,659,784,1047,1319].forEach((f,i)=>beep(f,'triangle',.25,.25,i*.12));},
};
window.toggleMute=function(){soundOn=!soundOn;document.getElementById('muteBtn').textContent=soundOn?'🔊':'🔇';};
document.addEventListener('click',()=>{try{getACtx();}catch(e){}},{once:true});

/* ══ UTILS ══ */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const randId=(n=8)=>Math.random().toString(36).substr(2,n).toUpperCase();
const roomCode=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ';return Array.from({length:4},()=>c[Math.floor(Math.random()*c.length)]).join('');};
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));const el=document.getElementById(id);if(el)el.classList.add('active');}
function toast(msg,dur=2500){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}
function flash(icon,text,sub,dur=2000){document.getElementById('flashIcon').textContent=icon;document.getElementById('flashText').textContent=text;document.getElementById('flashSub').textContent=sub||'';const el=document.getElementById('flashMsg');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}
function spawnConf(n=50){const layer=document.getElementById('confLayer');const cols=['#e040fb','#00e5ff','#76ff03','#ff9100','#fff','#ffd700'];for(let i=0;i<n;i++){const p=document.createElement('div');p.className='conf-p';const sz=Math.random()*12+5;p.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*cols.length)]};border-radius:${Math.random()>.5?'50%':'3px'};animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*.6}s`;layer.appendChild(p);setTimeout(()=>p.remove(),5000);}}
const detach=()=>{listeners.forEach(l=>off(l));listeners=[];};

/* ══ TAB ══ */
window.showTab=function(tab){const isC=tab==='create';document.getElementById('panelCreate').style.display=isC?'block':'none';document.getElementById('panelJoin').style.display=isC?'none':'block';document.getElementById('tabCreate').className='tab-btn'+(isC?' active':'');document.getElementById('tabJoin').className='tab-btn'+(!isC?' active':'');};

/* ══ GENERATE CITY ══ */
function generateCity(){
  const objs=[];
  let id=0;
  /* Streets grid + random objects */
  const density=0.0015; // objects per sq px
  const totalObjs=Math.floor(WORLD*WORLD*density);
  for(let i=0;i<totalObjs;i++){
    const type=OBJ_TYPES[Math.floor(Math.random()*OBJ_TYPES.length)];
    const x=Math.random()*WORLD;
    const y=Math.random()*WORLD;
    objs.push({id:id++,x,y,type:OBJ_TYPES.indexOf(type),eaten:false,eatenBy:null});
  }
  return objs;
}

/* ══ CREATE / JOIN ══ */
window.createRoom=async function(){
  const name=document.getElementById('playerName').value.trim();
  if(!name){toast('Enter your name!');return;}
  myName=name;myPid=randId();roomId=roomCode();isHost=true;
  const dur=parseInt(document.getElementById('settingDur').value);
  const maxP=parseInt(document.getElementById('settingMax').value);
  await set(ref(db,`hg2/${roomId}`),{
    meta:{hostId:myPid,status:'lobby',duration:dur,maxPlayers:maxP,createdAt:Date.now()},
    players:{[myPid]:{name:myName,colorIdx:0,score:0,size:1,alive:true,joinedAt:Date.now()}}
  });
  enterLobby();
};

window.joinRoom=async function(){
  const name=document.getElementById('playerName').value.trim();
  const code=document.getElementById('joinCode').value.trim().toUpperCase();
  if(!name){toast('Enter your name!');return;}
  if(code.length!==4){toast('Enter 4-letter code');return;}
  myName=name;myPid=randId();roomId=code;isHost=false;
  const snap=await get(ref(db,`hg2/${roomId}/meta`));
  if(!snap.exists()){toast('Room not found');return;}
  const meta=snap.val();
  if(meta.status!=='lobby'){toast('Game already started!');return;}
  const ps=await get(ref(db,`hg2/${roomId}/players`));
  const cnt=ps.exists()?Object.keys(ps.val()).length:0;
  if(cnt>=meta.maxPlayers){toast('Room full');return;}
  const used=ps.exists()?Object.values(ps.val()).map(p=>p.colorIdx):[];
  const colorIdx=[0,1,2,3,4,5].find(c=>!used.includes(c))??0;
  await set(ref(db,`hg2/${roomId}/players/${myPid}`),{name:myName,colorIdx,score:0,size:1,alive:true,joinedAt:Date.now()});
  enterLobby();
};

/* ══ LOBBY ══ */
function enterLobby(){
  detach();showScreen('screenLobby');
  document.getElementById('lobbyCode').textContent=roomId;
  const pRef=ref(db,`hg2/${roomId}/players`);
  onValue(pRef,snap=>renderLobbyPlayers(snap.val()||{}));listeners.push(pRef);
  const mRef=ref(db,`hg2/${roomId}/meta`);
  onValue(mRef,snap=>{
    if(!snap.exists())return;
    const meta=snap.val();gameState.meta=meta;
    const m=Math.floor(meta.duration/60),s=meta.duration%60;
    document.getElementById('lobbyMeta').textContent=`Duration: ${m}:${s.toString().padStart(2,'0')} · Max ${meta.maxPlayers} players`;
    if(meta.status==='playing'){detach();beginGame(meta);}
    if(meta.status==='lobby'&&!isHost){detach();setTimeout(()=>enterLobby(),300);}
  });listeners.push(mRef);
}

function renderLobbyPlayers(players){
  const sorted=Object.entries(players).sort((a,b)=>a[1].joinedAt-b[1].joinedAt);
  const list=document.getElementById('lobbyPlayers');list.innerHTML='';
  sorted.forEach(([pid,p])=>{
    const row=document.createElement('div');row.className='pl-row';
    const col=COLORS[p.colorIdx%COLORS.length];
    row.innerHTML=`<div class="pl-dot" style="background:${col};"></div>
      <span class="pl-name" style="color:${col};">${esc(p.name)}</span>
      ${pid===myPid?'<span class="pl-badge badge-you">You</span>':''}
      ${isHost&&pid===myPid?'<span class="pl-badge badge-host">Host</span>':''}`;
    list.appendChild(row);
  });
  document.getElementById('lobbyCount').textContent=`${sorted.length} / ${gameState?.meta?.maxPlayers||6} players`;
  document.getElementById('btnStart').style.display=(isHost&&sorted.length>=2)?'block':'none';
  document.getElementById('waitMsg').style.display=isHost?'none':'block';
}

window.leaveRoom=async function(){
  detach();stopGame();
  if(roomId&&myPid)await remove(ref(db,`hg2/${roomId}/players/${myPid}`));
  roomId=null;myPid=null;isHost=false;
  showScreen('screenLanding');
};

/* ══ START GAME ══ */
window.startGame=async function(){
  if(!isHost)return;
  const ps=await get(ref(db,`hg2/${roomId}/players`));
  const pids=Object.keys(ps.val());
  /* Generate and save city (host generates, all read) */
  const city=generateCity();
  const startPositions=[
    {x:400,y:400},{x:WORLD-400,y:400},{x:400,y:WORLD-400},
    {x:WORLD-400,y:WORLD-400},{x:WORLD/2,y:300},{x:WORLD/2,y:WORLD-300}
  ];
  const updates={};
  updates[`hg2/${roomId}/meta/status`]='playing';
  updates[`hg2/${roomId}/meta/startTs`]=Date.now();
  updates[`hg2/${roomId}/city`]=city;
  pids.forEach((pid,i)=>{
    const sp=startPositions[i%startPositions.length];
    updates[`hg2/${roomId}/positions/${pid}`]={x:sp.x,y:sp.y,vx:0,vy:0,size:1,score:0,alive:true,ts:Date.now()};
  });
  await update(ref(db),updates);
};

/* ══ BEGIN GAME ══ */
async function beginGame(meta){
  showScreen('screenGame');
  gameState={meta};
  gameRunning=true;gameOver=false;

  /* Load city */
  const citySnap=await get(ref(db,`hg2/${roomId}/city`));
  cityObjects=citySnap.val()||generateCity();

  /* My start position */
  const posSnap=await get(ref(db,`hg2/${roomId}/positions/${myPid}`));
  const myStart=posSnap.val()||{x:WORLD/2,y:WORLD/2};
  const ps=await get(ref(db,`hg2/${roomId}/players`));
  const players=ps.val()||{};
  const myData=players[myPid]||{};

  me.x=myStart.x;me.y=myStart.y;
  me.vx=0;me.vy=0;me.size=1;me.score=0;me.eaten=0;me.alive=true;
  me.colorIdx=myData.colorIdx||0;

  cam.x=me.x;cam.y=me.y;

  canvas=document.getElementById('gameCanvas');
  ctx=canvas.getContext('2d');
  resizeCanvas();

  if('ontouchstart' in window) document.getElementById('joystickWrap').style.display='block';

  attachGameListeners();
  startTimer(meta.startTs||Date.now());
  startSyncLoop();
  requestAnimationFrame(gameLoop);
}

function resizeCanvas(){
  if(!canvas)return;
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W;canvas.height=H;
}
window.addEventListener('resize',resizeCanvas);

/* ══ FIREBASE LISTENERS ══ */
function attachGameListeners(){
  const posRef=ref(db,`hg2/${roomId}/positions`);
  onValue(posRef,snap=>{
    if(!snap.exists())return;
    const all=snap.val();
    Object.entries(all).forEach(([pid,data])=>{
      if(pid===myPid)return;
      if(!others[pid])others[pid]={};
      const o=others[pid];
      o.x=data.x;o.y=data.y;o.size=data.size||1;
      o.score=data.score||0;o.alive=data.alive!==false;
      const p=gameState.players?.[pid];
      o.colorIdx=p?.colorIdx??1;o.name=p?.name||'?';
    });
  });
  listeners.push(posRef);

  const plRef=ref(db,`hg2/${roomId}/players`);
  onValue(plRef,snap=>{
    if(!snap.exists())return;
    gameState.players=snap.val();
    Object.entries(snap.val()).forEach(([pid,p])=>{if(pid!==myPid&&others[pid]){others[pid].colorIdx=p.colorIdx;others[pid].name=p.name;}});
    renderScoreboard();
  });
  listeners.push(plRef);

  /* City updates (eaten objects) */
  const cityRef=ref(db,`hg2/${roomId}/city`);
  onValue(cityRef,snap=>{if(snap.exists())cityObjects=snap.val();});
  listeners.push(cityRef);

  const mRef=ref(db,`hg2/${roomId}/meta`);
  onValue(mRef,snap=>{
    if(!snap.exists())return;
    gameState.meta=snap.val();
    if(snap.val().status==='over')handleGameOver(snap.val());
    if(snap.val().status==='lobby'&&!isHost){stopGame();enterLobby();}
  });
  listeners.push(mRef);
}

/* ══ TIMER ══ */
function startTimer(startTs){
  const dur=gameState.meta?.duration||180;
  timerInterval=setInterval(()=>{
    if(!gameRunning){clearInterval(timerInterval);return;}
    const left=Math.max(0,dur-Math.floor((Date.now()-startTs)/1000));
    const m=Math.floor(left/60),s=left%60;
    document.getElementById('hudTimer').textContent=`${m}:${s.toString().padStart(2,'0')}`;
    if(left<=0&&isHost)triggerGameOver();
  },500);
}

/* ══ SYNC LOOP ══ */
function startSyncLoop(){
  syncTimer=setInterval(async()=>{
    if(!gameRunning||!me.alive)return;
    document.getElementById('hudSize').textContent=`Size: ${Math.round(me.size*10)/10}`;
    document.getElementById('hudScore').textContent=`Score: ${me.score}`;
    await update(ref(db),{
      [`hg2/${roomId}/positions/${myPid}`]:{
        x:Math.round(me.x),y:Math.round(me.y),vx:Math.round(me.vx),vy:Math.round(me.vy),
        size:Math.round(me.size*100)/100,score:me.score,alive:me.alive,ts:Date.now()
      },
      [`hg2/${roomId}/players/${myPid}/score`]:me.score,
      [`hg2/${roomId}/players/${myPid}/size`]:Math.round(me.size*10)/10,
    });
  },SYNC_MS);
}

/* ══ INPUT ══ */
const keys={};
window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

/* Joystick */
let joyActive=false,joyDx=0,joyDy=0,joyOriginX=0,joyOriginY=0,joyId=-1;
const jWrap=document.getElementById('joystickWrap');
const jThumb=document.getElementById('joystickThumb');
jWrap.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joyId=t.identifier;joyOriginX=t.clientX;joyOriginY=t.clientY;joyActive=true;},{passive:false});
window.addEventListener('touchmove',e=>{if(!joyActive)return;e.preventDefault();for(const t of e.changedTouches){if(t.identifier===joyId){const dx=t.clientX-joyOriginX,dy=t.clientY-joyOriginY;const dist=Math.sqrt(dx*dx+dy*dy);const max=50;const cx=dx/Math.max(dist,1)*Math.min(dist,max);const cy=dy/Math.max(dist,1)*Math.min(dist,max);jThumb.style.transform=`translate(calc(-50% + ${cx}px), calc(-50% + ${cy}px))`;joyDx=cx/max;joyDy=cy/max;}}},{passive:false});
window.addEventListener('touchend',e=>{for(const t of e.changedTouches){if(t.identifier===joyId){joyActive=false;joyDx=0;joyDy=0;jThumb.style.transform='translate(-50%,-50%)';}}});

/* ══ GAME LOOP ══ */
let lastTime=0;
function gameLoop(ts){
  if(!gameRunning)return;
  requestAnimationFrame(gameLoop);
  const dt=Math.min((ts-lastTime)/1000,.05);
  lastTime=ts;
  if(me.alive&&!gameOver)updateMe(dt);
  renderFrame();
}

function updateMe(dt){
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['a']||keys['A'])dx=-1;
  if(keys['ArrowRight']||keys['d']||keys['D'])dx=1;
  if(keys['ArrowUp']||keys['w']||keys['W'])dy=-1;
  if(keys['ArrowDown']||keys['s']||keys['S'])dy=1;
  if(joyActive){dx=joyDx;dy=joyDy;}
  const len=Math.sqrt(dx*dx+dy*dy);
  if(len>0){dx/=len;dy/=len;}

  /* Speed decreases slightly as hole grows (bigger = slower) */
  const spd=Math.max(80, SPEED - me.size*3);
  me.vx=dx*spd; me.vy=dy*spd;

  me.x=Math.max(0,Math.min(WORLD,me.x+me.vx*dt));
  me.y=Math.max(0,Math.min(WORLD,me.y+me.vy*dt));

  /* My hole radius scales with size */
  const myR=getHoleRadius(me.size);

  /* Check city object collisions */
  cityObjects.forEach((obj,idx)=>{
    if(obj.eaten)return;
    const type=OBJ_TYPES[obj.type];
    if(!type)return;
    const dist=Math.sqrt((me.x-obj.x)**2+(me.y-obj.y)**2);
    const eatDist=myR*0.8;
    /* Can only eat if size big enough */
    if(me.size >= type.size*0.7 && dist < eatDist + type.w*0.4){
      /* Eat it */
      cityObjects[idx]={...obj,eaten:true,eatenBy:myPid};
      me.score+=type.pts;
      me.eaten++;
      me.size=Math.min(me.size+type.pts*0.05+0.1, 50);
      SFX.eat(type.pts);
      flash(type.emoji,`+${type.pts} pts!`,`Size: ${Math.round(me.size*10)/10}`,900);
      /* Push eaten update to Firebase */
      update(ref(db),{[`hg2/${roomId}/city/${idx}/eaten`]:true,[`hg2/${roomId}/city/${idx}/eatenBy`]:myPid});
    }
  });

  /* Check player collisions */
  Object.entries(others).forEach(([pid,o])=>{
    if(!o.alive)return;
    const dist=Math.sqrt((me.x-o.x)**2+(me.y-o.y)**2);
    const myR2=getHoleRadius(me.size);
    const theirR=getHoleRadius(o.size);
    if(dist < myR2 + theirR){
      if(me.size > o.size*1.2){
        /* I eat them */
        eatPlayer(pid,o);
      } else if(o.size > me.size*1.2){
        /* They eat me */
        meDie();
      }
    }
  });

  /* Smooth camera */
  cam.x+=(me.x-cam.x)*0.08;
  cam.y+=(me.y-cam.y)*0.08;
}

function getHoleRadius(size){ return 15 + size * 4; }

async function eatPlayer(pid,o){
  me.size=Math.min(me.size+o.size*0.5+2,50);
  me.score+=Math.round(o.size*20);
  SFX.eatPlayer();
  flash('💥',`Ate ${o.name||'?'}!`,`+${Math.round(o.size*20)} pts!`,1500);
  await update(ref(db),{
    [`hg2/${roomId}/positions/${pid}/alive`]:false,
    [`hg2/${roomId}/players/${pid}/alive`]:false,
  });
}

async function meDie(){
  if(!me.alive)return;
  me.alive=false;
  await update(ref(db),{
    [`hg2/${roomId}/positions/${myPid}/alive`]:false,
    [`hg2/${roomId}/players/${myPid}/alive`]:false,
  });
  SFX.die();
  flash('💀','You were eaten!','You were too small!',2500);
}

/* ══ RENDER ══ */
function renderFrame(){
  if(!ctx)return;
  ctx.clearRect(0,0,W,H);

  /* Dynamic zoom: bigger hole = zoom out */
  const myR=getHoleRadius(me.size);
  const zoom=Math.max(0.3, Math.min(1, 300/(myR*4)));

  ctx.save();
  ctx.translate(W/2,H/2);
  ctx.scale(zoom,zoom);
  ctx.translate(-cam.x,-cam.y);

  /* ── CITY BACKGROUND ── */
  /* Sky / ground */
  ctx.fillStyle='#1a1205';
  ctx.fillRect(0,0,WORLD,WORLD);

  /* Road grid */
  const ROAD=200;
  ctx.strokeStyle='#2a2010';
  ctx.lineWidth=40;
  for(let x=0;x<=WORLD;x+=ROAD){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD);ctx.stroke();}
  for(let y=0;y<=WORLD;y+=ROAD){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD,y);ctx.stroke();}
  /* Road markings */
  ctx.strokeStyle='#3a3020';
  ctx.lineWidth=3;
  ctx.setLineDash([20,20]);
  for(let x=ROAD/2;x<=WORLD;x+=ROAD){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD);ctx.stroke();}
  for(let y=ROAD/2;y<=WORLD;y+=ROAD){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD,y);ctx.stroke();}
  ctx.setLineDash([]);
  /* Sidewalk blocks */
  ctx.fillStyle='#252010';
  for(let bx=0;bx<WORLD;bx+=ROAD){
    for(let by=0;by<WORLD;by+=ROAD){
      ctx.fillRect(bx+25,by+25,ROAD-50,ROAD-50);
    }
  }

  /* ── CITY OBJECTS ── */
  /* Only render visible */
  const viewLeft=cam.x-W/(2*zoom)-200;
  const viewRight=cam.x+W/(2*zoom)+200;
  const viewTop=cam.y-H/(2*zoom)-200;
  const viewBot=cam.y+H/(2*zoom)+200;

  ctx.font='28px serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  cityObjects.forEach(obj=>{
    if(obj.eaten)return;
    if(obj.x<viewLeft||obj.x>viewRight||obj.y<viewTop||obj.y>viewBot)return;
    const type=OBJ_TYPES[obj.type];
    if(!type)return;
    /* Shadow */
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(obj.x+4,obj.y+4+type.h*0.25,type.w*0.35,type.h*0.12,0,0,Math.PI*2);
    ctx.fill();
    /* Emoji */
    const fs=Math.max(16,Math.min(50,type.w*0.7));
    ctx.font=`${fs}px serif`;
    ctx.fillText(type.emoji,obj.x,obj.y);
    /* Size indicator */
    if(type.size>me.size+2){
      /* Too big — show as locked */
      ctx.fillStyle='rgba(255,255,255,0.3)';
      ctx.font='bold 10px DM Sans';
      ctx.fillText(`sz${type.size}`,obj.x,obj.y-fs*0.7);
    }
  });

  /* ── OTHER PLAYERS ── */
  Object.entries(others).forEach(([pid,o])=>{
    if(!o.alive)return;
    const col=COLORS[(o.colorIdx||1)%COLORS.length];
    const r=getHoleRadius(o.size);
    /* Hole glow */
    const grd=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,r*1.5);
    grd.addColorStop(0,col+'44');grd.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(o.x,o.y,r*1.5,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
    /* Hole */
    ctx.beginPath();ctx.arc(o.x,o.y,r,0,Math.PI*2);
    const hgrd=ctx.createRadialGradient(o.x-r*.3,o.y-r*.3,0,o.x,o.y,r);
    hgrd.addColorStop(0,'#111');hgrd.addColorStop(0.7,col+'33');hgrd.addColorStop(1,col);
    ctx.fillStyle=hgrd;ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=3;ctx.stroke();
    /* Name */
    ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(12,r*.4)}px DM Sans`;
    ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText((o.name||'?').slice(0,8),o.x,o.y-r-4);
  });

  /* ── MY HOLE ── */
  if(me.alive){
    const col=COLORS[me.colorIdx%COLORS.length];
    const r=getHoleRadius(me.size);
    /* Outer glow */
    const grd=ctx.createRadialGradient(me.x,me.y,0,me.x,me.y,r*2);
    grd.addColorStop(0,col+'66');grd.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(me.x,me.y,r*2,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
    /* Hole body */
    ctx.beginPath();ctx.arc(me.x,me.y,r,0,Math.PI*2);
    const hgrd=ctx.createRadialGradient(me.x-r*.3,me.y-r*.3,0,me.x,me.y,r);
    hgrd.addColorStop(0,'#000');hgrd.addColorStop(0.7,col+'55');hgrd.addColorStop(1,col);
    ctx.fillStyle=hgrd;ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
    /* Name */
    ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(12,r*.4)}px DM Sans`;
    ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText(myName.slice(0,8),me.x,me.y-r-4);
  }

  ctx.restore();
}

/* ══ SCOREBOARD ══ */
function renderScoreboard(){
  const players=gameState.players||{};
  const sorted=Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
  const ranks=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'];
  document.getElementById('scoreList').innerHTML=sorted.map(([pid,p],i)=>{
    const col=COLORS[(p.colorIdx||0)%COLORS.length];
    return `<div class="sc-row">
      <span style="font-size:.65rem;">${ranks[i]||i+1}</span>
      <div class="sc-dot" style="background:${col};"></div>
      <span class="sc-name">${esc(p.name)}</span>
      <span class="sc-score">${p.score||0}</span>
    </div>`;
  }).join('');
}

/* ══ GAME OVER ══ */
async function triggerGameOver(){
  if(gameOver)return;
  const players=gameState.players||{};
  const sorted=Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
  const winnerId=sorted[0]?.[0]||myPid;
  await update(ref(db),{[`hg2/${roomId}/meta/status`]:'over',[`hg2/${roomId}/meta/winnerId`]:winnerId});
}

function handleGameOver(meta){
  if(gameOver)return;
  gameOver=true;stopGame();SFX.win();spawnConf(80);
  const players=gameState.players||{};
  const sorted=Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
  const winner=players[meta.winnerId];
  const stage=document.getElementById('podiumStage');stage.innerHTML='';
  const slots=[{r:1,cls:'p-step-2',medal:'🥈',order:1},{r:0,cls:'p-step-1',medal:'🥇',order:2},{r:2,cls:'p-step-3',medal:'🥉',order:3}];
  slots.forEach(slot=>{
    const entry=sorted[slot.r];if(!entry)return;
    const [pid,p]=entry;const col=COLORS[(p.colorIdx||0)%COLORS.length];
    const step=document.createElement('div');step.className=`p-step ${slot.cls}`;step.style.order=slot.order;
    step.innerHTML=`<div class="p-step-icon" style="color:${col};">🕳️</div>
      <div class="p-step-inner"><div class="p-step-medal">${slot.medal}</div>
      <div class="p-step-name" style="color:${col};">${esc(p.name)}</div>
      <div class="p-step-pts">${p.score||0} pts</div></div>`;
    stage.appendChild(step);
  });
  document.getElementById('podiumSub').textContent=winner?`🏆 ${winner.name} ate the city!`:'Game over!';
  document.getElementById('podiumOverlay').classList.add('show');
}

function stopGame(){
  gameRunning=false;
  clearInterval(timerInterval);
  clearInterval(syncTimer);
  detach();
}

window.playAgain=async function(){
  document.getElementById('podiumOverlay').classList.remove('show');
  if(!isHost){toast('Waiting for host…');return;}
  detach();stopGame();
  await Promise.all([remove(ref(db,`hg2/${roomId}/positions`)),remove(ref(db,`hg2/${roomId}/city`))]);
  const ps=await get(ref(db,`hg2/${roomId}/players`));
  const upd={[`hg2/${roomId}/meta/status`]:'lobby',[`hg2/${roomId}/meta/startTs`]:null,[`hg2/${roomId}/meta/winnerId`]:null};
  if(ps.exists())Object.keys(ps.val()).forEach(pid=>{upd[`hg2/${roomId}/players/${pid}/score`]=0;upd[`hg2/${roomId}/players/${pid}/size`]=1;upd[`hg2/${roomId}/players/${pid}/alive`]=true;});
  await update(ref(db),upd);
  cityObjects=[];others={};me.size=1;me.score=0;me.eaten=0;
  enterLobby();
};

window.goHome=function(){
  stopGame();document.getElementById('podiumOverlay').classList.remove('show');
  roomId=null;myPid=null;isHost=false;gameState={};cityObjects=[];others={};
  showScreen('screenLanding');
};

/* Floating bg dots */
(function(){
  const c=document.getElementById('bgDots');
  let s='';
  for(let i=0;i<60;i++){
    s+=`<div style="position:absolute;left:${Math.random()*100}%;top:${Math.random()*100}%;
      width:${Math.random()*3+1}px;height:${Math.random()*3+1}px;
      background:rgba(${Math.random()>.5?'224,64,251':'0,229,255'},${Math.random()*.5+.1});
      border-radius:50%;animation:ptFloat ${3+Math.random()*5}s ease-in-out ${Math.random()*5}s infinite alternate;"></div>`;
  }
  c.innerHTML=s;
  const style=document.createElement('style');
  style.textContent='@keyframes ptFloat{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-20px) scale(1.3)}}';
  document.head.appendChild(style);
})();
</script>
